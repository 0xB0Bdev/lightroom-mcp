name: Publish

# Builds a release tag and publishes it to PyPI using trusted publishing. CI's release
# job dispatches this after semantic-release cuts a release; run it by hand to publish an
# existing tag. PyPI only trusts this file, so it must stay a top-level workflow rather
# than one called from ci.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.3
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lightroom-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          uv build
          ls -l dist
          version="${TAG#v}"
          if [ ! -f "dist/lightroom_mcp-$version-py3-none-any.whl" ] || [ ! -f "dist/lightroom_mcp-$version.tar.gz" ]; then
            echo "::error::Building $TAG did not produce version $version"; exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

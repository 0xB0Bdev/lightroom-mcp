name: Publish

# Publishes the files attached to a GitHub release to PyPI using trusted publishing.
# CI's release job dispatches this after semantic-release cuts a release; run it by hand
# to publish an existing release. PyPI only trusts this file, so it must stay a top-level
# workflow rather than one called from ci.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.1
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lightroom-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"; exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "lightroom_mcp-${TAG#v}-py3-none-any.whl" \
            --pattern "lightroom_mcp-${TAG#v}.tar.gz"
          ls -l dist
          if [ "$(ls dist | wc -l)" -ne 2 ]; then
            echo "::error::Expected a wheel and an sdist for $TAG"; exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

[project]
name = "lightroom-mcp"
version = "0.1.4"
description = "CLI and MCP server for Adobe Lightroom Classic"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xB0Bdev" }]
keywords = ["lightroom", "lightroom-classic", "adobe", "mcp", "model-context-protocol", "photography", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Lua",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastmcp>=4.2.2",
    "pydantic>=2.14.3",
    "typer>=0.29.2",
]

[project.urls]
Homepage = "https://github.com/0xB0Bdev/lightroom-mcp"
Source = "https://github.com/0xB0Bdev/lightroom-mcp"
Issues = "https://github.com/0xB0Bdev/lightroom-mcp/issues"
Changelog = "https://github.com/0xB0Bdev/lightroom-mcp/blob/main/CHANGELOG.md"

[project.scripts]
lightroom-mcp = "lightroom_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = true
major_on_zero = false
build_command = """
uv lock --upgrade-package lightroom-mcp
uv run --no-project python scripts/sync_plugin_version.py
git add uv.lock src/lightroom_mcp/lrplugin/LightroomBridge.lrplugin/Info.lua
uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

